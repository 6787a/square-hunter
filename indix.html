

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شکارچی مربع</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, sans-serif;
  background: linear-gradient(135deg, #10172f, #243b65);
  color: white;
  text-align: center;
  padding: 35px 15px;
}

.container {
  max-width: 450px;
  margin: auto;
  padding: 25px 15px;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h1 {
  color: #ffd166;
  font-size: 30px;
  margin-top: 5px;
}

.subtitle {
  color: #cbd5e1;
  font-size: 14px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 25px 0;
}

.stat {
  background: #182744;
  border-radius: 14px;
  padding: 15px;
  min-width: 115px;
}

.stat span {
  display: block;
  color: #ffd166;
  font-size: 27px;
  font-weight: bold;
  margin-top: 8px;
}

canvas {
  display: block;
  width: 300px;
  max-width: 100%;
  height: auto;
  margin: 20px auto;
  background: #f8fafc;
  border: 4px solid #ffd166;
  border-radius: 12px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 28px;
  font-size: 17px;
  font-weight: bold;
  font-family: Tahoma;
  background: #ffd166;
  color: #17213a;
  cursor: pointer;
  margin-top: 15px;
}

button:hover {
  background: #ffb703;
  transform: scale(1.04);
}

#message {
  color: #ffd166;
  font-weight: bold;
  min-height: 24px;
}

.instructions {
  color: #cbd5e1;
  font-size: 13px;
  line-height: 2;
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 شکارچی مربع</h1>
<p class="subtitle">آماده‌ای رکورد خودت رو بشکنی؟</p>

<div class="stats">
  <div class="stat">
    امتیاز
    <span id="score">0</span>
  </div>

  <div class="stat">
    زمان
    <span id="timer">10</span>
  </div>
</div>

<canvas id="game" width="300" height="300"></canvas>

<p class="instructions">
با کلیدهای جهت‌دار حرکت کن و مربع قرمز رو شکار کن!
</p>

<p id="message"></p>

<button id="restart" style="display:none;">
شروع دوباره
</button>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let x, y, targetX, targetY;
let score, time, gameOver;
let countdown;

// صدای تشویق
function sayAfarin() {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance("آفرین!");

  voice.lang = "fa-IR";
  voice.rate = 0.9;
  voice.pitch = 0.85;
  voice.volume = 1;

  speechSynthesis.speak(voice);
}

// رسم مربع‌ها
function draw() {
  ctx.clearRect(0, 0, 300, 300);

  ctx.fillStyle = "blue";
  ctx.fillRect(x, y, 25, 25);

  ctx.fillStyle = "red";
  ctx.fillRect(targetX, targetY, 25, 25);
}

// ساخت هدف جدید
function newTarget() {
  do {
    targetX = Math.floor(Math.random() * 28) * 10;
    targetY = Math.floor(Math.random() * 28) * 10;
  } while (targetX === x && targetY === y);
}

// بررسی برخورد
function checkHit() {
  if (x === targetX && y === targetY) {

    sayAfarin();

    score++;
    document.getElementById("score").textContent = score;

    newTarget();

    time = 10;
    document.getElementById("timer").textContent = time;
  }
}

// پایان بازی
function endGame() {
  gameOver = true;
  clearInterval(countdown);

  document.getElementById("message").textContent =
    "بازی تمام شد! امتیاز شما: " + score;

  document.getElementById("restart").style.display =
    "inline-block";
}

// شروع بازی
function startGame() {
  clearInterval(countdown);

  x = 10;
  y = 10;
  score = 0;
  time = 10;
  gameOver = false;

  document.getElementById("score").textContent = score;
  document.getElementById("timer").textContent = time;
  document.getElementById("message").textContent = "";
  document.getElementById("restart").style.display = "none";

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  newTarget();
  draw();

  countdown = setInterval(function() {
    time--;
    document.getElementById("timer").textContent = time;

    if (time <= 0) {
      endGame();
    }
  }, 1000);
}

// کنترل حرکت با صفحه کلید
document.addEventListener("keydown", function(event) {
  if (gameOver) return;

  if (event.key.startsWith("Arrow")) {
    event.preventDefault();
  }

  if (event.key === "ArrowUp") y -= 10;
  if (event.key === "ArrowDown") y += 10;
  if (event.key === "ArrowLeft") x -= 10;
  if (event.key === "ArrowRight") x += 10;

  x = Math.max(0, Math.min(270, x));
  y = Math.max(0, Math.min(270, y));

  checkHit();
  draw();
});

// دکمه شروع دوباره
document.getElementById("restart").addEventListener(
  "click", startGame
);

draw();
startGame();

</script>

</body>
</html>
